# =============================================================================
# Render Blueprint (render.yaml) — Isolated Deployment for `preeti-dev` Branch
# Deploys isolated resources that do NOT overwrite or collide with `main`:
#   1. kh-postgres-preeti-dev (Managed PostgreSQL + pgvector Database)
#   2. kh-backend-preeti-dev  (FastAPI + LangGraph Python Web Service)
#   3. kh-frontend-preeti-dev (React + TypeScript + Vite Static Site)
# =============================================================================

databases:
  - name: kh-postgres-preeti-dev
    databaseName: knowledge_handover_preeti_dev
    user: kh_user_preeti_dev
    plan: free

services:
  # 1. FastAPI + LangGraph Backend Web Service (preeti-dev branch)
  - type: web
    name: kh-backend-preeti-dev
    runtime: python
    branch: preeti-dev
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kh-postgres-preeti-dev
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Set LLM_PROVIDER to "openai_compatible" and add LLM_BASE_URL + LLM_API_KEY in Render Dashboard
      # (e.g., Groq https://api.groq.com/openai/v1 with llama-3.3-70b-versatile or qwen-2.5-32b)
      # Defaults safely to deterministic_extractive if no external LLM key is provided.
      - key: LLM_PROVIDER
        value: "deterministic_extractive"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL_NAME
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_PROVIDER
        value: "deterministic_hash"
      - key: EMBEDDING_MODEL_NAME
        value: "all-MiniLM-L6-v2"
      - key: EMBEDDING_DIMENSION
        value: "384"

  # 2. React + Vite Frontend Static Site (preeti-dev branch)
  - type: web
    name: kh-frontend-preeti-dev
    runtime: static
    branch: preeti-dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kh-backend-preeti-dev
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

