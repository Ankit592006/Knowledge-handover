[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-handover-backend"
version = "1.0.0"
description = "Knowledge Handover – AI-Powered Knowledge Continuity Platform (FastAPI + LangGraph + PostgreSQL/pgvector)"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Preeti Satish Mittal"},
  {name = "Ankit Madanlal Chaudhari"}
]

dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "starlette>=0.40.0,<0.42.0",
  "uvicorn[standard]>=0.29.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "email-validator>=2.1.0,<3.0.0",
  "sqlalchemy>=2.0.29,<3.0.0",
  "alembic>=1.13.1,<2.0.0",
  "psycopg[binary]>=3.1.18,<4.0.0",
  "pgvector>=0.2.5,<1.0.0",
  "argon2-cffi>=23.1.0,<25.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "langgraph>=0.0.40,<1.0.0",
  "langchain-core>=0.1.45,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1,<9.0.0",
  "pytest-asyncio>=0.23.6,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
